<title>MD 유형 테스트 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 리뷰 보드 — 화면 흐름 목록 | 실제로 눌러보는 폰 | 이 화면의 로직(스펙). 전체 플로우 탭은 같은 화면을 축소해 가로로 나열 */
:root{
  --bg:#ECF0F6; --bg-dot:#D2DAE7; --panel:#FFFFFF; --ink:#101828; --muted:#5A6478; --line:#DBE2ED;
  --accent:#266EFB; --accent-soft:#E7EEFF; --good:#0E9F6E; --warn:#C2410C;
  --font-ui:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  /* 앱 화면은 첫 화면 시안의 라이트 룩으로 고정 */
  --a-blue:#266EFB; --a-blue-d:#1B59D9; --a-blue-soft:#EAF1FF; --a-blue-line:#C9DAFE; --a-on:#FFFFFF;
  --a-ink:#14171F; --a-sub:#6B7280; --a-faint:#9AA3B2; --a-line:#E5E9F1; --a-card:#FFFFFF; --a-bg:#FFFFFF; --a-bg2:#EEF3FE; --a-fill:#F4F6FA;
  --a-good:#11994B; --a-good-soft:#E7F6ED; --a-amber:#B45309; --a-amber-soft:#FDF2E3; --a-shadow:rgba(38,110,251,.10);
  --font-app:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --bezel:#0B0F19; --bezel-edge:#2A3142; --island:#000000;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111B; --bg-dot:#1A2232; --panel:#131A27; --ink:#E6EBF4; --muted:#97A2B6; --line:#253044;
  --accent:#7AA5FF; --accent-soft:#1A2744; --good:#34D399; --warn:#FB923C; color-scheme:dark;
  --bezel:#05070C; --bezel-edge:#30384B;
}}
:root[data-theme="dark"]{
  --bg:#0C111B; --bg-dot:#1A2232; --panel:#131A27; --ink:#E6EBF4; --muted:#97A2B6; --line:#253044;
  --accent:#7AA5FF; --accent-soft:#1A2744; --good:#34D399; --warn:#FB923C; color-scheme:dark;
  --bezel:#05070C; --bezel-edge:#30384B;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── 상단 바 ── */
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;max-width:1380px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.seg button{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.ghost-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600}

/* ── 3단 보드 ── */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:28px;align-items:start;max-width:1380px;margin:0 auto;padding-block:10px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.panel h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.nav-grp{margin:0 0 6px}
.nav-grp > span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;letter-spacing:.02em}
.nav-grp:first-of-type > span{margin-top:0}
.nav-item{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:8px 8px;border-radius:9px;position:relative}
.nav-item:hover{background:var(--accent-soft)}
.nav-item[aria-current="true"]{background:var(--accent-soft)}
.nav-item[aria-current="true"] .sid{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.sid{font-family:var(--font-mono);font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 0;text-align:center;color:var(--muted);background:var(--panel)}
.nav-item b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.nav-item small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.qdots{display:flex;gap:4px;margin:6px 0 2px 52px}
.qdot{width:22px;height:20px;border-radius:5px;border:1px solid var(--line);font-family:var(--font-mono);font-size:10.5px;color:var(--muted);display:grid;place-items:center;background:var(--panel)}
.qdot.on{border-color:var(--accent);color:var(--accent)}
.qdot.cur{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.presets{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:grid;gap:6px}
.preset{text-align:left;padding:9px 10px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;line-height:1.4}
.preset:hover{border-color:var(--accent)}
.preset b{display:block;font-weight:600;font-size:13px}
.preset small{color:var(--muted)}
.strip{display:none}

/* ── 무대 ── */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.stage-cap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;text-align:center;flex-wrap:wrap;justify-content:center}
.stage-cap .sid{padding:2px 7px}
.device{position:relative;padding:12px;border-radius:60px;background:var(--bezel);box-shadow:0 0 0 2px var(--bezel-edge) inset,0 40px 70px -30px rgba(16,24,40,.45),0 8px 18px -8px rgba(16,24,40,.25)}
.device::after{content:"";position:absolute;top:23px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:var(--island);z-index:6;pointer-events:none}
.device .screen{border-radius:48px}

/* ── 스펙 패널 ── */
.spec h3{font-size:16px;margin:2px 0 4px;letter-spacing:-.01em}
.spec .lede{color:var(--muted);font-size:13px;margin:0 0 14px}
.spec-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.spec-sec > h4{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.spec ul,.spec ol{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px}
.spec li::marker{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.opt-table{width:100%;border-collapse:collapse;font-size:12.5px}
.opt-table td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.opt-table tr.sel td{color:var(--accent);font-weight:600}
.opt-table td:first-child{font-family:var(--font-mono);width:20px;color:var(--muted)}
.opt-table tr.sel td:first-child{color:var(--accent)}
.opt-table td:last-child{text-align:right;white-space:nowrap;font-family:var(--font-mono)}
.sbars{display:grid;gap:7px}
.sbar{display:grid;grid-template-columns:88px 1fr 40px;align-items:center;gap:8px;font-size:12.5px}
.sbar .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.sbar .fl{display:block;height:100%;background:var(--muted);border-radius:4px;transition:width .25s}
.sbar.top .fl{background:var(--accent)} .sbar.top{font-weight:600}
.sbar.done .fl{background:var(--good)}
.sbar .v{text-align:right;font-family:var(--font-mono);font-size:12px}
.trace{counter-reset:t;list-style:none;padding:0!important}
.trace li{counter-increment:t;display:grid;grid-template-columns:22px 1fr;gap:6px}
.trace li::before{content:counter(t);font-family:var(--font-mono);font-size:11px;color:var(--panel);background:var(--accent);border-radius:5px;height:18px;display:grid;place-items:center;margin-top:1px}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.codes span{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.muted{color:var(--muted)}

/* ── 전체 플로우 ── */
.overview{max-width:none;padding-block:8px 48px}
.ov-intro{max-width:1380px;margin:0 auto 18px;color:var(--muted);font-size:13.5px}
.ov-scroll{overflow-x:auto;padding-bottom:12px}
.ov-board{display:grid;gap:34px;width:max-content;margin:0 auto;padding:4px 4px 0}
.lane{display:flex;align-items:flex-start}
.lane-h{width:132px;flex:none;padding-top:150px;padding-right:12px}
.lane-h b{display:block;font-size:15px}
.lane-h small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:4px}
.lane-h i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:6px;vertical-align:0}
.lane.l-int .lane-h i{background:#7C5CFF}
.lane.l-crs .lane-h i{background:#0E9F6E}
.fr{width:195px;flex:none}
.fr-box{display:block;width:195px;height:422px;overflow:hidden;border-radius:26px;border:1px solid var(--line);background:var(--a-bg);box-shadow:0 14px 30px -18px rgba(16,24,40,.35);position:relative;transition:transform .15s,box-shadow .15s}
.fr-box:hover{transform:translateY(-2px);box-shadow:0 20px 34px -18px rgba(16,24,40,.45);border-color:var(--accent)}
.fr-box .screen{transform:scale(.5);transform-origin:0 0;width:390px!important;height:844px!important;pointer-events:none}
.fr-cap{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline}
.fr-cap .sid{padding:1px 6px}
.fr-cap b{font-size:13px}
.fr-cap small{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.4}
.arr{width:46px;flex:none;align-self:flex-start;margin-top:200px;display:grid;place-items:center;color:var(--muted)}
.arr svg{width:30px;height:12px}
.loop-note{width:150px;flex:none;margin:150px 0 0 14px;padding:12px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--muted);background:var(--panel)}
.loop-note b{color:var(--ink);display:block;margin-bottom:2px}

/* ── 반응형 ── */
@media (max-width:1180px){
  .wrap{grid-template-columns:minmax(0,1fr) 320px}
  .flow-nav{display:none}
  .strip{display:flex;grid-column:1/-1;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .strip button{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;white-space:nowrap}
  .strip button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .strip .sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  .panel{position:static;max-height:none}
  .device{padding:0;background:none;box-shadow:none;border-radius:0;width:100%;max-width:430px}
  .device::after{display:none}
  .device .screen{width:100%;height:min(780px,calc(100svh - 32px));min-height:620px;border-radius:24px;border:1px solid var(--line)}
  .topbar .brand small{display:none}
}
@media (max-width:400px){#live .orbit{transform:scale(.88);transform-origin:top center;margin-bottom:-38px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ════════ 앱 화면 (390 × 844) ════════ */
.screen{width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--a-bg);color:var(--a-ink);font-family:var(--font-app);font-size:15px;line-height:1.5;letter-spacing:-.015em;text-align:left;isolation:isolate}
.screen button{font-family:var(--font-app);letter-spacing:inherit}
.sb{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 38px;font-size:16px;font-weight:600;letter-spacing:0;font-family:-apple-system,"SF Pro Text",var(--font-app)}
.sb-i{display:flex;gap:6px;align-items:center}
.sb-i svg{display:block}
.ah{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--a-ink)}
.ib:hover{background:var(--a-fill)}
.ib svg{width:24px;height:24px}
.ht{font-size:17px;font-weight:700;flex:1}
.ab{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 20px 28px;scrollbar-width:none}
.ab::-webkit-scrollbar{display:none}
.af{flex:none;padding:10px 20px 26px;display:grid;gap:8px;background:var(--a-bg)}
.cta{height:56px;border-radius:16px;background:var(--a-blue);color:var(--a-on);font-size:18px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.cta:hover{background:var(--a-blue-d)}
.cta:disabled{background:var(--a-line);color:var(--a-faint);cursor:default}
.cta small{font-size:14px;font-weight:600;opacity:.85}
.cta.line{background:var(--a-bg);color:var(--a-blue);border:1.5px solid var(--a-blue-line)}
.cta.line:hover{background:var(--a-blue-soft)}
.txt-btn{height:40px;color:var(--a-sub);font-size:15px;font-weight:600}
.t{font-size:25px;font-weight:800;line-height:1.36;margin:10px 0 8px;letter-spacing:-.03em}
.st{color:var(--a-sub);font-size:15px;margin:0 0 22px}

/* S0 */
.s0{background:linear-gradient(180deg,#FFFFFF 0%,#FFFFFF 36%,var(--a-bg2) 100%)}
.s0 .af{background:transparent}
.s0 .ab{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:0}
.pill{margin-top:44px;display:inline-block;padding:5px 14px;border-radius:999px;background:var(--a-blue-soft);color:var(--a-blue);font-size:13px;font-weight:700}
.s0-h{margin:20px 0 0;font-size:28px;line-height:1.32;font-weight:800;letter-spacing:-.035em}
.s0-h em{font-style:normal;color:var(--a-blue);font-size:31px}
.s0-sub{margin:18px 0 0;color:var(--a-sub);font-size:15px;line-height:1.55}
.orbit{position:relative;width:358px;height:316px;margin-top:20px;flex:none}
.orbit .ring{position:absolute;left:39px;top:16px;width:280px;height:280px;border-radius:50%;border:1.5px solid #D7E3FC;background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 70%)}
.orbit img{position:absolute;left:83px;top:69px;width:196px;height:174px;animation:float 4s ease-in-out infinite}
.oc{position:absolute;padding:6px 13px;border-radius:999px;border:1.5px solid var(--a-blue);background:var(--a-bg);color:var(--a-blue);font-size:13px;font-weight:700;box-shadow:0 4px 12px -6px var(--a-shadow);white-space:nowrap}
.copy{margin:4px 0 0;text-align:center;color:var(--a-sub);font-size:13px}
@keyframes float{50%{transform:translateY(-5px)}}

/* S1 */
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:52px 1fr 20px;gap:14px;align-items:center;text-align:left;padding:18px 16px;border-radius:18px;border:1.5px solid var(--a-line);background:var(--a-card);transition:border-color .15s,background .15s}
.mode:hover,.mode.on{border-color:var(--a-blue);background:var(--a-blue-soft)}
.mode .mi{width:52px;height:52px;border-radius:15px;background:var(--a-blue-soft);display:grid;place-items:center;color:var(--a-blue)}
.mode.on .mi,.mode:hover .mi{background:var(--a-bg)}
.mode .mi svg{width:28px;height:28px}
.mode b{display:block;font-size:17px;font-weight:700}
.mode small{display:block;color:var(--a-sub);font-size:13.5px;margin-top:2px;line-height:1.4}
.mode .mm{display:flex;gap:5px;margin-top:8px}
.mode .mm i{font-style:normal;font-size:12px;font-weight:600;color:var(--a-blue);background:var(--a-bg);border:1px solid var(--a-blue-line);border-radius:6px;padding:1px 7px}
.mode .chev{color:var(--a-faint)}
.hint{display:flex;gap:6px;align-items:flex-start;color:var(--a-sub);font-size:13.5px;margin:18px 2px 0}
.hint svg{flex:none;margin-top:3px}

/* S2 */
.depts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dept{height:46px;border-radius:12px;border:1.5px solid var(--a-line);font-size:15px;font-weight:600;color:var(--a-ink);background:var(--a-card)}
.dept:hover{border-color:var(--a-blue-line)}
.dept.on{border-color:var(--a-blue);background:var(--a-blue-soft);color:var(--a-blue)}
.dept.wide{grid-column:1/-1}
.dnote{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--a-fill);font-size:13.5px;color:var(--a-sub)}
.dnote b{color:var(--a-ink)}

/* S3 */
.prog{flex:1;height:6px;border-radius:3px;background:var(--a-line);overflow:hidden;margin:0 6px}
.prog span{display:block;height:100%;background:var(--a-blue);border-radius:3px;transition:width .3s}
.pc{font-size:14px;font-weight:700;color:var(--a-sub);min-width:34px;text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--a-blue);margin-top:18px}
.qt{font-size:23px;font-weight:800;line-height:1.4;margin:8px 0 26px;letter-spacing:-.03em;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:15px 16px;border-radius:16px;border:1.5px solid var(--a-line);background:var(--a-card);font-size:15.5px;font-weight:500;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--a-blue-line)}
.opt .ol{width:30px;height:30px;border-radius:9px;background:var(--a-fill);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--a-sub)}
.opt.on{border-color:var(--a-blue);background:var(--a-blue-soft);color:var(--a-blue-d);font-weight:600}
.opt.on .ol{background:var(--a-blue);color:var(--a-on)}

/* S4 */
.lead{font-size:20px;font-weight:800;line-height:1.4;margin:6px 0 6px;letter-spacing:-.03em}
.note{display:flex;gap:6px;align-items:flex-start;color:var(--a-sub);font-size:13px;margin:0 0 14px}
.note svg{flex:none;margin-top:3px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:12px;background:var(--a-fill);color:var(--a-faint);margin-bottom:6px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-family:var(--font-app);font-size:15px;color:var(--a-ink);outline:none}
.search input::placeholder{color:var(--a-faint)}
.grp{margin-top:18px}
.grp h3{font-size:14px;font-weight:700;margin:0 0 8px;display:flex;align-items:baseline;gap:6px;color:var(--a-ink)}
.grp h3 small{font-size:12.5px;color:var(--a-sub);font-weight:500}
.slots{display:grid;gap:8px}
.slot{border:1.5px solid var(--a-line);border-radius:14px;background:var(--a-card);overflow:hidden}
.slot.on{border-color:var(--a-blue)}
.crs{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px}

      if (p === main || exclude.includes(p) || p === '초급') continue;
      const j = jointNeed(main, p, taken);
      if (j && (!best || j.k < best.k)) best = { md: p, ...j };
    }
    return best;
  }

  function linkedProgress(dept, checked) {
    if (!LINKED[dept]) return [];
    const req = checked.has('02098') || checked.has('01914');
    const major = [...checked].filter(c => BIGMAJOR.has(c));
    return LINKED[dept].map(l => {
      const designated = l.courses.filter(c => checked.has(c) || Object.entries(l.old || {}).some(([o, n]) => n === c && checked.has(o)));
      const n = (req ? 1 : 0) + Math.min(designated.length, 2) + (major.length ? 1 : 0);
      return { ...l, req, designated, major: major[0] || null, n };
    });
  }

  function courseResult(checked, dept) {
    const taken = takenSlots(checked);
    const prog = Object.fromEntries(TYPES.map(t => [t, Math.min(count(t, taken), 4)]));
    const openLeft = t => slotsOf(t).filter(s => !taken.has(s.id) && s.tier === 0).length;
    const ranked = TYPES.slice().sort((a, b) => prog[b] - prog[a] || openLeft(b) - openLeft(a) || ORDER.indexOf(a) - ORDER.indexOf(b));
    const main = ranked[0];
    const tie = TYPES.filter(t => prog[t] === prog[main]);
    const done = TYPES.filter(t => prog[t] === 4);
    const trace = [];
    trace.push('충족 슬롯 ' + TYPES.map(t => `${t} ${prog[t]}`).join(' · '));
    if (tie.length > 1) {
      trace.push(`진행률 1위 동점(${tie.join('·')} ${prog[main]}/4) → 남은 슬롯 중 ${TERM} 개설 수 ` + tie.map(t => `${t} ${openLeft(t)}`).join(' · ') + ` → ${main}`);
    } else trace.push(`진행률 1위: ${main} ${prog[main]}/4`);
    const recs = remainingFor(main, taken);
    if (recs.length) trace.push('남은 과목 추천: ' + recs.map(s => s.name + (s.tier === 0 ? ` (${TERM} 개설)` : s.tier === 2 ? ' (학점교류)' : ' (교내)')).join(', '));
    const partner = bestPartner(main, taken, done);
    if (partner) trace.push(`함께 따기: ${partner.md} → 지금부터 ${partner.k}과목이면 둘 다 4/4 (${main}만은 ${partner.needA}과목)`);
    const linked = linkedProgress(dept, checked);
    linked.forEach(l => trace.push(`연계융합 ${l.md}: 개론 ${l.req ? '✓' : '✗'} · 지정 ${Math.min(l.designated.length, 2)}/2 · 빅데이터전공 ${l.major ? '✓' : '✗'} → ${l.n}/4`));
    return { mode: 'course', main, prog, ranked, tie: tie.length > 1 ? tie : null, done, taken, recs, partner, linked, weak: prog[main] <= 1, trace };
  }

  // 흥미 결과의 '함께 따기'는 대표 4과목을 들었다고 가정해 계산
  function interestPartner(main) {
    if (main === '초급') return null;
    const plan = new Set(MD[main].rep);
    return bestPartner(main, plan);
  }

  return { TERM, TYPES, MD, C, OPEN, BIGMAJOR, SLOTS, SLOT, CODE2SLOT, GROUPS, LINKED, DEPTS, QS, INTEREST, ORDER, CAREER, ROLE,
    interestScores, readiness, stageOf, interestResult, takenSlots, count, remainingFor, jointNeed, bestPartner, interestPartner, linkedProgress, courseResult, L, J };
})();
if (typeof module !== 'undefined') module.exports = MDL;

function compute(s) {

function badge(slot) {

    const via = slot.openCodes.includes(slot.main) ? '' : ` · ${slot.openCodes[0]}`;
    return `<span class="bd open">${M.TERM} 개설${via}</span>`;
  }
  return slot.tier === 2 ? '<span class="bd x">학점교류</span>' : '<span class="bd in">교내 · 이번 학기 없음</span>';
}
const cname = c => (M.C[c] || [c])[0];

function renderScreen(s, live) {
  const R = { S0, S1, S2, S3, S4, S5, S6 }[s.screen];
  return R(s, live);
}

function S0() {
  const chips = [['빅데이터초급', 25, 50], ['빅데이터관리', 222, 42], ['빅데이터분석', 0, 150], ['머신러닝', null, 140], ['빅데이터마이닝', 28, 244], ['빅데이터고급', 214, 262]];
  return `${SB}
  <div class="ab">
    <span class="pill">빅데이터 표준 마이크로디그리 유형 테스트</span>
    <h1 class="s0-h">나에게 꼭 맞는<br><em>마이크로디그리는?</em></h1>
    <p class="s0-sub">간단한 질문에 답하고<br>나의 빅데이터 성향과 추천 MD를 알아보세요</p>
    <div class="orbit" aria-hidden="true"><div class="ring"></div><img src="${MASCOT}" alt="">
      ${chips.map(([t, x, y]) => `<span class="oc" style="${x == null ? 'right:0' : 'left:' + x + 'px'};top:${y}px">${t}</span>`).join('')}
    </div>
  </div>
  <div class="af"><button class="cta" data-act="start">테스트 시작하기</button><p class="copy">© 서울시립대학교 빅데이터혁신융합대학</p></div>`;
}

function S1(s) {
  const card = (v, icon, title, sub, meta) => `<button class="mode${s.mode === v ? ' on' : ''}" data-act="mode" data-v="${v}">
    <span class="mi">${icon}</span><span><b>${title}</b><small>${sub}</small><span class="mm">${meta.map(m => `<i>${m}</i>`).join('')}</span></span><span class="chev">${ICON.right}</span></button>`;
  return `${SB}${header(backBtn)}
  <div class="ab">
    <h2 class="t">어떤 방식으로<br>알아볼까요?</h2>
    <p class="st">결과를 본 뒤 다른 방식으로도 다시 확인할 수 있어요</p>

      ${card('course', ICON.list, '과목 기반으로 알아보기', '들은 과목을 체크하면 MD별 진행률을 알려줘요', ['과목 체크', '약 3분'])}

    <p class="hint">${ICON.info}<span>어떤 걸 고를지 모르겠다면 흥미 기반부터 시작해 보세요</span></p>
  </div>`;
}

function S2(s) {
  const linked = s.dept && M.LINKED[s.dept];
  return `${SB}${header(backBtn)}
  <div class="ab">
    <h2 class="t">어느 학과인가요?</h2>
    <p class="st">학과에 연계융합 MD가 있으면 결과에서 함께 알려드려요</p>

}

function S3(s) {
  const q = M.QS[s.q];
  const pct = ((s.q + 1) / 8) * 100;
  return `${SB}${header(`${backBtn}<div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="8" aria-valuenow="${s.q + 1}"><span style="width:${pct}%"></span></div><span class="pc">${s.q + 1}/8</span>`)}

    </div>
  </div>`;
}

const live = document.getElementById('live');
function paint(keepScroll) {
  const ab = live.querySelector('.ab');

  const f = document.activeElement && live.contains(document.activeElement) ? document.activeElement : null;
  const fkey = f && f.dataset.act ? `[data-act="${f.dataset.act}"]${f.dataset.v != null ? `[data-v="${CSS.escape(f.dataset.v)}"]` : ''}` : null;
  live.className = 'screen ' + ({ S0: 's0', S5: 's5', S6: 's6' }[st.screen] || '');
  live.innerHTML = renderScreen(st, true);
  const nab = live.querySelector('.ab');
  if (nab) {
    if (keepScroll) nab.scrollTop = top;
    if (st.scrollEnd) { nab.scrollTop = nab.scrollHeight; st.scrollEnd = false; }
  }
  if (fkey) { const el = live.querySelector(fkey); if (el) el.focus({ preventScroll: true }); }
  paintChrome();
}
function go(screen, extra = {}) {
  clearTimeout(timer);

  paint(false);
  if (screen === 'S5') timer = setTimeout(() => { compute(st); go('S6'); }, 1500);
}
function toast(msg) {
  const t = live.querySelector('.toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

live.addEventListener('click', e => {

      const k = fs(over);
      if (i) h += `<span class="arr" aria-hidden="true">${ICON.arrow}</span>`;
      h += `<div class="fr"><div class="fr-box" role="button" tabindex="0" data-frame="${k}" aria-label="${id} ${name} 프로토타입에서 열기"><div class="screen ${({ S0: 's0', S5: 's5', S6: 's6' })[over.screen] || ''}" inert>${renderScreen(FRAME_STATES[k], false)}</div></div>
        <div class="fr-cap"><span class="sid">${id}</span><b>${name}</b><small>${note}</small></div></div>`;
    });
    if (l.cls === 'l-crs') h += `<div class="loop-note"><b>S7 → 반대 분기</b>[흥미 기반으로도]를 누르면 S3로, 흥미 결과에서는 S4로 가요. 두 결과는 ‘두 방식 결과 비교’ 카드로 함께 보여줘요.</div>`;
    if (l.cls === 'l-com') h += `<div class="loop-note"><b>S2 → 두 갈래</b>흥미 기반은 S3, 과목 기반은 S4로. 과목 기반에서 0개를 고르면 S3로 넘어가요.</div>`;
    h += '</div>';
  });
  board.innerHTML = h;
  board.querySelectorAll('.fr-box').forEach(b => {
    const s = FRAME_STATES[+b.dataset.frame];
    if (s.scrollEnd) { const ab = b.querySelector('.ab'); ab.scrollTop = ab.scrollHeight; }
  });
}

function setView(v) {
  view = v;
  document.getElementById('view-proto').hidden = v !== 'proto';
  document.getElementById('view-flow').hidden = v !== 'flow';
  document.querySelectorAll('.seg [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  if (v === 'flow' && !document.getElementById('board').innerHTML) buildBoard();
  if (v === 'flow') { const sc = document.querySelector('.ov-scroll'); requestAnimationFrame(() => { sc.scrollLeft = 0; }); }
}

paint(false);
const hash = (location.hash || '').slice(1);
if (hash === 'flow') setView('flow');
})();
</script>
